# Reusable factory jobs. Enrolled repos call this from their own
# .github/workflows/factory-caller.yml (written by scripts/enroll-repo.sh).
# The harness reaches the runner twice: as the `harness` plugin for the agent
# (skills are /harness:<name>) and as a checkout at .harness for the mechanical
# steps in scripts/factory/. Labels show state; dispatch starts work.
#
# anthropics/claude-code-action is pinned to a commit, not the floating v1 tag:
# a v1 release once broke self-hosted runners (issue 1126). To bump it, resolve
# the tag (gh api repos/anthropics/claude-code-action/git/ref/tags/v1, then
# git/tags/<sha>), replace the SHA everywhere in this file, and run
# scripts/factory/smoke.sh before pushing.
name: factory-jobs
on:
  workflow_call:
    inputs:
      job:
        description: triage | monitor | implement
        type: string
        required: true
      model:
        description: Model for this job (Sonnet for triage and monitor, Opus for implement)
        type: string
        required: false
        default: claude-sonnet-5
      issue_number:
        description: Issue to triage or implement
        type: number
        required: false
      run_id:
        description: Failed workflow run to monitor
        type: number
        required: false
      run_url:
        description: HTML URL of the failed run
        type: string
        required: false
      workflow_name:
        description: Name of the workflow that failed
        type: string
        required: false
      auto_merge:
        description: Merge the implement job's PR once its review and checks pass, when the issue came from the repo owner or the factory itself. A caller passes false to always leave a draft for human review.
        type: boolean
        required: false
        default: true
      runs_on:
        description: JSON for runs-on. Callers on the hub runner pass '["self-hosted","linux","factory"]' (written by enroll-repo.sh --runner); the default is a hosted runner.
        type: string
        required: false
        default: '"ubuntu-latest"'
      gate_minutes:
        description: Minutes a gate round (the wait for the PR's checks and one re-run) and a heal round may each run. The default fits a suite under about 12 minutes; a repo whose suite runs longer declares more with enroll-repo.sh --gate-minutes (hub repos only). job_minutes must grow with it.
        type: number
        required: false
        default: 30
      job_minutes:
        description: Cap on the implement job. enroll-repo.sh writes 270 + 5 × gate_minutes for a declared window (the capped steps plus overhead); hosted runners stop a job at 360 regardless.
        type: number
        required: false
        default: 350
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  SETTINGS: '{"attribution": {"commit": "", "pr": ""}, "env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'

jobs:
  author:
    # Only the owner's issues start work. A part of a split issue is judged
    # by its parent's author. The job answers through `ok`; triage and
    # implement need it and skip when it is false.
    if: (inputs.job == 'triage' || inputs.job == 'implement') && github.actor != 'claude[bot]'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    env:
      N: ${{ inputs.issue_number }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean the runner
        if: runner.environment == 'self-hosted'
        run: |
          # A persistent runner keeps the last job's checkout and the runner user's
          # Claude state; the plugin marketplace cache makes the next run fail
          # (anthropics/claude-code-action issue 983). Both go. Safe only because each
          # runner has its own user and home (scripts/factory/runner.sh).
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf "$HOME/.claude" "$HOME/.claude.json"
      - uses: actions/checkout@v4
        with:
          repository: hunterphillips/agent-harness
          ref: main # callers pin factory.yml@main; keep the scripts on the same ref
          path: .harness
          persist-credentials: false
      - id: gate
        run: bash .harness/scripts/factory/author-gate.sh

  triage:
    needs: author
    if: inputs.job == 'triage' && github.actor != 'claude[bot]' && needs.author.outputs.ok == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 20
    concurrency:
      group: factory-triage-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      actions: write # start the implement run when the gate passes
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    env:
      N: ${{ inputs.issue_number }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Clean the runner
        if: runner.environment == 'self-hosted'
        run: |
          # A persistent runner keeps the last job's checkout and the runner user's
          # Claude state; the plugin marketplace cache makes the next run fail
          # (anthropics/claude-code-action issue 983). Both go. Safe only because each
          # runner has its own user and home (scripts/factory/runner.sh).
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf "$HOME/.claude" "$HOME/.claude.json"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hunterphillips/agent-harness
          ref: main # callers pin factory.yml@main; keep the scripts on the same ref
          path: .harness
          persist-credentials: false
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            Triage issue #${{ inputs.issue_number }} in ${{ github.repository }}.

            Invoke the Skill tool with `harness:coding`, then follow its routing table
            row for triage (the `triage/triage.md` workflow) exactly. Read the issue with
            `gh issue view ${{ inputs.issue_number }} --comments`; write the result with
            `gh issue edit` (labels) and `gh issue comment`. Create any missing label
            with `gh label create ... || true` before applying it.

            Hard limits: do not modify files, commit, push, open a pull request, or
            create issues. Exactly one status label and one comment at the end. If the
            result is `ready-for-agent`, the workflow starts the implement run; you do not.
          claude_args: >-
            --model ${{ inputs.model }} --max-turns 40 --max-budget-usd 2
            --permission-mode dontAsk
            --allowedTools Bash,Read,Glob,Grep,Skill,Agent
            --disallowedTools 'Bash(git push:*)' 'Bash(gh pr create:*)' 'Bash(gh pr merge:*)' 'Bash(gh issue create:*)'
      - name: Start the implement run when triage passed
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .harness/scripts/factory/lib.sh
          status=$(status_of "$N")
          [ "$status" = ready-for-agent ] || { echo "triage result: $status; nothing to start"; exit 0; }
          .harness/scripts/factory/dispatch.sh "$N" || {
            set_status "$N" ready-for-human
            mention_owner "$N" "Triage passed, but the implement run did not start. Run: $RUN_URL"
          }

  monitor:
    # The caller's event payload is visible here. A failed run from a pull
    # request, or from a push to any branch but the default, is its author's:
    # the red check is already on their PR or branch, and this job would
    # diagnose it against a checkout of main, where the change is not. Kept
    # here rather than in the caller template so no repo needs re-enrolling.
    if: >-
      inputs.job == 'monitor' &&
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.event != 'push' ||
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 45
    concurrency:
      group: factory-monitor-${{ github.repository }}-${{ inputs.workflow_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
      id-token: write
    steps:
      - name: Clean the runner
        if: runner.environment == 'self-hosted'
        run: |
          # A persistent runner keeps the last job's checkout and the runner user's
          # Claude state; the plugin marketplace cache makes the next run fail
          # (anthropics/claude-code-action issue 983). Both go. Safe only because each
          # runner has its own user and home (scripts/factory/runner.sh).
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf "$HOME/.claude" "$HOME/.claude.json"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git identity for pushes
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
      - name: Fetch run metadata and failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view ${{ inputs.run_id }} \
            --json name,conclusion,headBranch,headSha,url,event,jobs \
            --jq '{name,conclusion,headBranch,headSha,url,event,failedJobs:[.jobs[]|select(.conclusion=="failure")|{name,url,steps:[.steps[]|select(.conclusion=="failure")|.name]}]}' \
            > "$RUNNER_TEMP/run.json" || echo '{}' > "$RUNNER_TEMP/run.json"
          gh run view ${{ inputs.run_id }} --log-failed 2>/dev/null | tail -c 40000 > "$RUNNER_TEMP/failed-logs.txt"
          [ -s "$RUNNER_TEMP/failed-logs.txt" ] || echo "(no failed-job logs available)" > "$RUNNER_TEMP/failed-logs.txt"
          echo "run.json: $(wc -c < "$RUNNER_TEMP/run.json") bytes; logs: $(wc -l < "$RUNNER_TEMP/failed-logs.txt") lines"
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        with:
          allowed_bots: claude[bot],github-actions # failures on main after a factory merge
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            /harness:monitor
            Repository: ${{ github.repository }}
            Workflow: ${{ inputs.workflow_name }}
            Failed run: ${{ inputs.run_url }} (id ${{ inputs.run_id }})
            Run metadata (JSON): ${{ runner.temp }}/run.json
            Failed job logs: ${{ runner.temp }}/failed-logs.txt
            Read both files first, then follow the monitor skill's steps exactly.
            ${{ inputs.auto_merge && 'AUTO-MERGE ALLOWED for a fix PR that meets the skill''s merge step.' || 'AUTO-MERGE NOT ALLOWED: leave any fix PR as a draft.' }}
          claude_args: >-
            --model ${{ inputs.model }} --max-turns 60 --max-budget-usd 5
            --permission-mode dontAsk
            --allowedTools Bash,Read,Glob,Grep,Skill,Agent,Edit,Write

  implement:
    needs: author
    if: inputs.job == 'implement' && github.actor != 'claude[bot]' && needs.author.outputs.ok == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Four 45-minute attempts, then the merge gate: a 15-minute review, a gate
    # round that waits on CI, and up to two heal rounds each followed by a
    # fresh review and gate. Gate and heal rounds run gate_minutes each
    # (default 30); the cap is job_minutes (default 350, which has fit every
    # run so far; 270 + 5 × gate_minutes covers the longest path with its
    # overhead). Hosted runners stop a job at 360.
    timeout-minutes: ${{ inputs.job_minutes }}
    concurrency:
      group: factory-issue-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      actions: write # start the next part of a split issue
      contents: write
      issues: write
      pull-requests: write
      checks: read
      statuses: read
      id-token: write
    env:
      N: ${{ inputs.issue_number }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      BRANCH: claude/issue-${{ inputs.issue_number }}
      AUTO_MERGE: ${{ inputs.auto_merge }}
      MAX_ATTEMPTS: 4
      MAX_HEALS: 2
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FACTORY: .harness/scripts/factory
      HARNESS: .harness
      GH_TOKEN: ${{ github.token }}
      AGENT_ARGS: >-
        --model ${{ inputs.model }} --max-turns 120 --max-budget-usd 8
        --permission-mode dontAsk
        --allowedTools Bash,Read,Glob,Grep,Skill,Agent,Edit,Write
      AGENT_PROMPT: |
        Implement issue #${{ inputs.issue_number }} in ${{ github.repository }}.

        Invoke the Skill tool with `harness:coding`, then follow its routing table
        row for implementing one self-contained issue (the
        `implement-issue/implement-issue.md` workflow) exactly, in order. You are
        already on branch `claude/issue-${{ inputs.issue_number }}`; the workflow
        claimed it. The workflow owns labels, the merge gate, and the hand-off; you
        own the code, the tests, the pull request text, and the marker files in
        `.factory/` (`done`, `handoff`, `split`). Run everything in the foreground.
        Never push to the default branch.
    steps:
      - name: Clean the runner
        if: runner.environment == 'self-hosted'
        run: |
          # A persistent runner keeps the last job's checkout and the runner user's
          # Claude state; the plugin marketplace cache makes the next run fail
          # (anthropics/claude-code-action issue 983). Both go. Safe only because each
          # runner has its own user and home (scripts/factory/runner.sh).
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          rm -rf "$HOME/.claude" "$HOME/.claude.json"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hunterphillips/agent-harness
          ref: main # callers pin factory.yml@main; keep the scripts on the same ref
          path: .harness
          persist-credentials: false
      - name: Git identity for pushes
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
      - id: pre
        name: Preflight (policy, claim or resume, in-progress)
        run: bash "$FACTORY/preflight.sh"

      - id: agent1
        if: steps.pre.outputs.run == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: 45
        with:
          allowed_bots: github-actions # dispatched runs (triage pass, next part) are started by the workflow token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            ${{ env.AGENT_PROMPT }}
            ${{ steps.pre.outputs.merge_line }}
            Attempt 1 of ${{ env.MAX_ATTEMPTS }}.
          claude_args: ${{ env.AGENT_ARGS }}
      - id: cp1
        name: Checkpoint after attempt 1
        if: ${{ !cancelled() && steps.pre.outputs.run == 'true' }}
        run: bash "$FACTORY/checkpoint.sh" 1 "${{ steps.agent1.outputs.execution_file }}"

      - id: agent2
        if: ${{ !cancelled() && steps.cp1.outputs.continue == 'true' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: 45
        with:
          allowed_bots: github-actions # dispatched runs (triage pass, next part) are started by the workflow token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            ${{ env.AGENT_PROMPT }}
            ${{ steps.pre.outputs.merge_line }}
            Attempt 2 of ${{ env.MAX_ATTEMPTS }}: the previous attempt ran out of turns or time while making progress. Resume the branch.
          claude_args: ${{ env.AGENT_ARGS }}
      - id: cp2
        name: Checkpoint after attempt 2
        if: ${{ !cancelled() && steps.cp1.outputs.continue == 'true' }}
        run: bash "$FACTORY/checkpoint.sh" 2 "${{ steps.agent2.outputs.execution_file }}"

      - id: agent3
        if: ${{ !cancelled() && steps.cp2.outputs.continue == 'true' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: 45
        with:
          allowed_bots: github-actions # dispatched runs (triage pass, next part) are started by the workflow token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            ${{ env.AGENT_PROMPT }}
            ${{ steps.pre.outputs.merge_line }}
            Attempt 3 of ${{ env.MAX_ATTEMPTS }}: earlier attempts ran out of turns or time while making progress. Resume the branch.
          claude_args: ${{ env.AGENT_ARGS }}
      - id: cp3
        name: Checkpoint after attempt 3
        if: ${{ !cancelled() && steps.cp2.outputs.continue == 'true' }}
        run: bash "$FACTORY/checkpoint.sh" 3 "${{ steps.agent3.outputs.execution_file }}"

      - id: agent4
        if: ${{ !cancelled() && steps.cp3.outputs.continue == 'true' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: 45
        with:
          allowed_bots: github-actions # dispatched runs (triage pass, next part) are started by the workflow token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            ${{ env.AGENT_PROMPT }}
            ${{ steps.pre.outputs.merge_line }}
            FINAL ATTEMPT (${{ env.MAX_ATTEMPTS }} of ${{ env.MAX_ATTEMPTS }}): resume the branch and follow implement-issue's final-attempt rule. Start no new work.
          claude_args: ${{ env.AGENT_ARGS }}
      - id: cp4
        name: Checkpoint after attempt 4
        if: ${{ !cancelled() && steps.cp3.outputs.continue == 'true' }}
        run: bash "$FACTORY/checkpoint.sh" 4 "${{ steps.agent4.outputs.execution_file }}"

      # The merge gate: an independent review whose verdict is machine-readable,
      # then gate.sh, which records the verdict and asks for a heal round when
      # the stop is checkable (findings, a failed check). Each heal round gets a
      # fresh review. Attempts are unrolled above; heal rounds are unrolled here.
      - id: rp
        name: Review prompt
        if: ${{ !cancelled() && steps.pre.outputs.run == 'true' && hashFiles('.factory/done') != '' && hashFiles('.factory/handoff') == '' }}
        run: bash "$FACTORY/review-prompt.sh"
      - id: review
        if: ${{ !cancelled() && steps.rp.outcome == 'success' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: 15
        with:
          allowed_bots: github-actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ env.SETTINGS }}
          prompt: |
            Read `.factory/review-prompt.md` and do exactly what it says. You are the
            merge gate for branch `claude/issue-${{ inputs.issue_number }}`: review the
            diff, change nothing, and return the verdict as structured output.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 40 --max-budget-usd 5
            --permission-mode dontAsk
            --allowedTools Read,Glob,Grep 'Bash(git diff:*)' 'Bash(git log:*)' 'Bash(git show:*)'
            --json-schema '{"type":"object","properties":{"critical":{"type":"integer"},"important":{"type":"integer"},"summary":{"type":"string"}},"required":["critical","important","summary"]}'
      - id: gate1
        name: Gate round 1
        if: ${{ !cancelled() && steps.review.outcome != 'skipped' }}
        timeout-minutes: ${{ inputs.gate_minutes }}
        env:
          GATE_MINUTES: ${{ inputs.gate_minutes }}
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: bash "$FACTORY/gate.sh" 1
      - id: heal1
        if: ${{ !cancelled() && steps.gate1.outputs.heal == 'true' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: ${{ inputs.gate_minutes }}
        with:
          allowed_bots: github-actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            ${{ env.AGENT_PROMPT }}
            ${{ steps.pre.outputs.merge_line }}
            HEAL ROUND 1 of ${{ env.MAX_HEALS }}: the merge gate stopped this branch. Read `.factory/feedback.md` first and follow implement-issue's heal rule. Start no new work.
          claude_args: ${{ env.AGENT_ARGS }}
      - id: cph1
        name: Checkpoint after heal round 1
        if: ${{ !cancelled() && steps.gate1.outputs.heal == 'true' }}
        run: bash "$FACTORY/checkpoint.sh" heal-1 "${{ steps.heal1.outputs.execution_file }}"
      - id: rp2
        name: Review prompt after heal round 1
        if: ${{ !cancelled() && steps.cph1.outcome == 'success' && hashFiles('.factory/done') != '' && hashFiles('.factory/handoff') == '' }}
        run: bash "$FACTORY/review-prompt.sh"
      - id: review2
        if: ${{ !cancelled() && steps.rp2.outcome == 'success' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: 15
        with:
          allowed_bots: github-actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ env.SETTINGS }}
          prompt: |
            Read `.factory/review-prompt.md` and do exactly what it says. You are the
            merge gate for branch `claude/issue-${{ inputs.issue_number }}`: review the
            diff, change nothing, and return the verdict as structured output.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 40 --max-budget-usd 5
            --permission-mode dontAsk
            --allowedTools Read,Glob,Grep 'Bash(git diff:*)' 'Bash(git log:*)' 'Bash(git show:*)'
            --json-schema '{"type":"object","properties":{"critical":{"type":"integer"},"important":{"type":"integer"},"summary":{"type":"string"}},"required":["critical","important","summary"]}'
      - id: gate2
        name: Gate round 2
        if: ${{ !cancelled() && steps.review2.outcome != 'skipped' }}
        timeout-minutes: ${{ inputs.gate_minutes }}
        env:
          GATE_MINUTES: ${{ inputs.gate_minutes }}
          REVIEW_JSON: ${{ steps.review2.outputs.structured_output }}
        run: bash "$FACTORY/gate.sh" 2
      - id: heal2
        if: ${{ !cancelled() && steps.gate2.outputs.heal == 'true' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: ${{ inputs.gate_minutes }}
        with:
          allowed_bots: github-actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          settings: ${{ env.SETTINGS }}
          prompt: |
            ${{ env.AGENT_PROMPT }}
            ${{ steps.pre.outputs.merge_line }}
            HEAL ROUND 2 of ${{ env.MAX_HEALS }}: the merge gate stopped this branch. Read `.factory/feedback.md` first and follow implement-issue's heal rule. Start no new work.
          claude_args: ${{ env.AGENT_ARGS }}
      - id: cph2
        name: Checkpoint after heal round 2
        if: ${{ !cancelled() && steps.gate2.outputs.heal == 'true' }}
        run: bash "$FACTORY/checkpoint.sh" heal-2 "${{ steps.heal2.outputs.execution_file }}"
      - id: rp3
        name: Review prompt after heal round 2
        if: ${{ !cancelled() && steps.cph2.outcome == 'success' && hashFiles('.factory/done') != '' && hashFiles('.factory/handoff') == '' }}
        run: bash "$FACTORY/review-prompt.sh"
      - id: review3
        if: ${{ !cancelled() && steps.rp3.outcome == 'success' }}
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 as of 2026-10-12
        timeout-minutes: 15
        with:
          allowed_bots: github-actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: ${{ env.SETTINGS }}
          prompt: |
            Read `.factory/review-prompt.md` and do exactly what it says. You are the
            merge gate for branch `claude/issue-${{ inputs.issue_number }}`: review the
            diff, change nothing, and return the verdict as structured output.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 40 --max-budget-usd 5
            --permission-mode dontAsk
            --allowedTools Read,Glob,Grep 'Bash(git diff:*)' 'Bash(git log:*)' 'Bash(git show:*)'
            --json-schema '{"type":"object","properties":{"critical":{"type":"integer"},"important":{"type":"integer"},"summary":{"type":"string"}},"required":["critical","important","summary"]}'
      - id: gate3
        name: Gate round 3
        if: ${{ !cancelled() && steps.review3.outcome != 'skipped' }}
        timeout-minutes: ${{ inputs.gate_minutes }}
        env:
          GATE_MINUTES: ${{ inputs.gate_minutes }}
          REVIEW_JSON: ${{ steps.review3.outputs.structured_output }}
        run: bash "$FACTORY/gate.sh" 3

      - name: Finish (merge, split, or hand off)
        if: ${{ always() && steps.pre.outputs.run == 'true' }}
        timeout-minutes: 15
        run: bash "$FACTORY/finish.sh"
      - name: Start the next part of a split issue
        if: ${{ !cancelled() && steps.pre.outputs.run == 'true' }}
        run: bash "$FACTORY/next-part.sh"
      - name: Save the session transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implement-transcript-${{ inputs.issue_number }}
          path: .factory/transcripts
          if-no-files-found: ignore
          retention-days: 14
