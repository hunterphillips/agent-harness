# Throwaway spike: does claude-code-action load the harness as a plugin from this repo?
name: spike-harness-action
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/hunterphillips/agent-harness.git
          plugins: |
            harness@agent-harness
          prompt: |
            Diagnostic run. Do NOT modify files, commit, push, or open PRs. Investigate and report only.
            1. List every skill name available to you, and every subagent type in your Agent tool. State explicitly whether `coding`, `harness:coding`, `codebase-locator`, and `harness:codebase-locator` appear.
            2. Invoke the Skill tool with `harness:coding`. Quote the first 3 lines of what loaded, or the exact error. Then try `coding` the same way.
            3. Find the installed plugin on disk (`ls ~/.claude/plugins; find ~/.claude/plugins -maxdepth 4 -name SKILL.md | head`) and confirm `skills/coding/create-plan/plan-template.md` exists next to the router; quote its first line.
            4. Run `which gh; gh auth status 2>&1; gh api user --jq .login 2>&1; env | grep -iE 'claude|otel' | sed 's/=.*/=<redacted>/'` and report.
            Print the full report, including command outputs, as your final message.
          show_full_output: true
          claude_args: "--max-turns 20 --allowedTools Bash,Read,Glob,Grep,Skill"
